<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yushi's iPhone</title>
  <meta name="description" content="2013년 4월 4일, 유우시의 휴대폰 (창작 프로젝트)">
  <link rel="stylesheet" href="css/device.css">
  <link rel="stylesheet" href="css/ios6.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/sms.css">
  <link rel="stylesheet" href="css/more-apps.css">
  <link rel="stylesheet" href="css/timetable.css">
</head>
<body>
  <main class="stage" id="stage">
    <!-- 기기 전체 (창 크기에 맞춰 main.js가 확대/축소) -->
    <div class="device-holder" id="holder">
      <div class="device" id="device">

        <!-- 측면 물리 버튼 -->
        <div class="hw hw-mute" aria-hidden="true"></div>
        <div class="hw hw-vol hw-vol-up" aria-hidden="true"></div>
        <div class="hw hw-vol hw-vol-down" aria-hidden="true"></div>
        <button class="hw hw-sleep" id="btnSleep" type="button" aria-label="잠자기/깨우기 버튼"></button>

        <!-- 흰색 전면 -->
        <div class="face">
          <div class="sensor" aria-hidden="true"></div>
          <div class="front-camera" aria-hidden="true"></div>
          <div class="earpiece" aria-hidden="true"></div>

          <!-- 디스플레이 -->
          <div class="glass">
            <div class="screen" id="screen">

              <!-- 홈 화면 -->
              <section class="layer home" id="home" aria-label="홈 화면">
                <div class="wallpaper"></div>
                <div class="statusbar" data-variant="home"></div>
                <!-- 옆으로 넘기는 페이지: 1) 앱 아이콘  2) 시간표 -->
                <div class="home-pages" id="homePages">
                  <div class="home-track" id="homeTrack">
                    <div class="home-page"><div class="springboard" id="springboard"></div></div>
                    <div class="home-page" aria-label="시간표"><div class="timetable" id="timetable"></div></div>
                  </div>
                </div>
                <div class="page-dots" aria-hidden="true">
                  <span class="dot-search"></span><span class="dot is-on"></span><span class="dot"></span>
                </div>
                <div class="dock">
                  <div class="dock-shelf" aria-hidden="true"></div>
                  <div class="dock-icons" id="dock"></div>
                </div>
              </section>

              <!-- 열린 앱이 들어오는 자리 -->
              <div class="layer app-layer" id="appLayer"></div>

              <!-- 잠금 화면 -->
              <section class="layer lock" id="lock" aria-label="잠금 화면">
                <div class="wallpaper"></div>
                <div class="statusbar" data-variant="lock"></div>
                <div class="lock-top">
                  <div class="lock-time" id="lockTime"></div>
                  <div class="lock-date" id="lockDate"></div>
                </div>
                <div class="lock-bottom">
                  <div class="slider" id="slider">
                    <span class="slider-text">밀어서 잠금 해제</span>
                    <div class="slider-knob" id="knob" role="slider" tabindex="0"
                         aria-label="밀어서 잠금 해제" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                      <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M3 9.5h14V4l12 8-12 8v-5.5H3z"/></svg>
                    </div>
                  </div>
                  <div class="camera-grabber" aria-hidden="true">
                    <svg viewBox="0 0 32 24"><path d="M5 7h4l1.6-2.5h10.8L23 7h4c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2z"/><circle cx="16" cy="14" r="4.4" fill="#2b2d31"/></svg>
                  </div>
                </div>
              </section>

              <!-- 화면이 꺼졌을 때 -->
              <div class="layer screen-off" id="screenOff" aria-hidden="true"></div>
            </div>
          </div>

          <!-- 물리 홈 버튼 -->
          <button class="home-button" id="btnHome" type="button" aria-label="홈 버튼"><span></span></button>
        </div>
      </div>
    </div>
  </main>

  <!-- 순서 중요: 설정 → 데이터 → 아이콘 → 앱 목록 → 앱 화면 → 실행 -->
  <script src="js/config.js"></script>
  <script src="js/data/wink-data.js"></script>
  <script src="js/data/daylog-data.js"></script>
  <script src="js/data/phone-data.js"></script>
  <script src="js/data/voice-data.js"></script>
  <script src="js/data/messages-data.js"></script>
  <script src="js/data/apps-data.js"></script>
  <script src="js/data/timetable-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/ui/stack.js"></script>
  <script src="js/ui/keyboard.js"></script>
  <script src="js/apps/wink.js"></script>
  <script src="js/apps/daylog.js"></script>
  <script src="js/apps/phone.js"></script>
  <script src="js/apps/voice.js"></script>
  <script src="js/apps/camera.js"></script>
  <script src="js/apps/sms.js"></script>
  <script src="js/apps/utilities.js"></script>
  <script src="js/apps/organizer.js"></script>
  <script src="js/apps/more-apps.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
